title = "New York City"
subtitle = "subway, bus, LIRR and Metro-North"

# MTA terms (https://www.mta.info/developers/terms-and-conditions, updated 13 Mar 2024) allow
# downloading, hosting and making the data available to others; they ask for no credit line,
# forbid stating or implying the use is licensed by the MTA, and allow saying the data came
# from the MTA. The live page refuses scripts (403); the text was read from the Wayback
# Machine copy of 14 Jul 2026.
# Not included: NYC Ferry. Its Developer Terms (https://www.ferry.nyc/developer-tools/) grant
# use only "to test, design, and support your products and services", and its site terms
# (https://www.ferry.nyc/legal/) forbid publication except as those terms permit: unclear for
# a published video.

